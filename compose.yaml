services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: univen
      POSTGRES_USER: univen
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U univen -d univen"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://database:5432/univen
      DATABASE_USER: univen
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      APP_ACCOUNT_KEY: ${APP_ACCOUNT_KEY:?Set a base64 encoded 32-byte APP_ACCOUNT_KEY}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:4200}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-}
    depends_on:
      database:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:4200:8080"
    depends_on:
      - backend
volumes:
  database:
