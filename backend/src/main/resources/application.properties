spring.application.name=univen-student-clone
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.timeout=12h
server.servlet.session.cookie.name=univen_clone_session
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.shutdown=graceful
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./.data/accounts;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.sql.init.mode=always
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
app.origin=${APP_ORIGIN:http://localhost:4200}
app.account-key=${APP_ACCOUNT_KEY:}
app.google-client-id=${GOOGLE_CLIENT_ID:}
app.google-client-secret=${GOOGLE_CLIENT_SECRET:}
app.microsoft-client-id=${MICROSOFT_CLIENT_ID:}
app.microsoft-client-secret=${MICROSOFT_CLIENT_SECRET:}
app.microsoft-tenant-id=${MICROSOFT_TENANT_ID:}
logging.level.org.springframework.web=INFO
